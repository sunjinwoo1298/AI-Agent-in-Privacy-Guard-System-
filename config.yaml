# PrivMAS configuration
# This file is safe to commit (no secrets). Put secrets in `.env`.

privacy:
  # The project now uses a single shared GLiNER PII backend for masking.
  default_strategy: gliner_pii
  llm_fallback_strategy: gliner_pii

  router:
    short_text_threshold: 200
    long_text_threshold: 1200
    # Keywords that raise sensitivity score (case-insensitive)
    sensitivity_keywords:
      - ssn
      - social security
      - passport
      - driver
      - license
      - credit card
      - debit card
      - cvv
      - bank
      - account
      - routing
      - iban
      - swift
      - dob
      - date of birth
      - address

agents:
  topology: hierarchical
  roles:
    detector:
      count: 1
      # Default strategy for this role; Supervisor can override
      strategy: gliner_pii
    analyzer:
      count: 1
      strategy: gliner_pii
    validator:
      count: 1
      strategy: gliner_pii

supervisor:
  use_llm: false
  # If enabled and GROQ_API_KEY is set, Supervisor can ask an LLM for a JSON plan.
  model: llama3-70b-8192

aggregation:
  # One of: prefer_validator, prefer_analyzer, prefer_most_masked, prefer_fastest
  policy: prefer_validator

llm:
  provider: groq
  api_key_env: GROQ_API_KEY

evaluation:
  track_messages: true
  # null means use all rows
  max_rows: null

generalist:
  # All generalist agents use the shared GLiNER-PII backend.
  strategies:
    - gliner_pii
